name: ClaudeDeck
options:
  bundleIdPrefix: co.ailogy
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
  createIntermediateGroups: true

packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: 1.13.0

configFiles:
  Debug: Local.xcconfig
  Release: Local.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    DEAD_CODE_STRIPPING: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES

targets:
  ClaudeDeck:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    entitlements:
      path: Sources/ClaudeDeck/Resources/ClaudeDeck.entitlements
      properties:
        com.apple.security.app-sandbox: false
    dependencies:
      - package: SwiftTerm
    sources:
      - path: Sources/ClaudeDeck
        excludes:
          - "Resources/Info.plist"
    resources:
      - path: Sources/ClaudeDeck/Resources/Assets.xcassets
        optional: true
    info:
      path: Sources/ClaudeDeck/Resources/Info.plist
      properties:
        CFBundleName: ClaudeDeck
        CFBundleDisplayName: ClaudeDeck
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "14.0"
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHighResolutionCapable: YES
        NSSupportsAutomaticTermination: YES
        NSSupportsSuddenTermination: NO
        NSHumanReadableCopyright: "Copyright © 2026 Stu Green"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.ailogy.claudedeck
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Sources/ClaudeDeck/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_PREVIEWS: YES
